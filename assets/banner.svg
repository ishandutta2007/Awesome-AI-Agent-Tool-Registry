<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: url(#textGrad); }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
      
      @keyframes floatParticle {
        0% { transform: translateY(0px) scale(1); opacity: 0.4; }
        50% { transform: translateY(-15px) scale(1.15); opacity: 0.8; }
        100% { transform: translateY(0px) scale(1); opacity: 0.4; }
      }
      
      @keyframes pulseNode {
        0% { r: 6px; stroke-opacity: 0.4; }
        50% { r: 9px; stroke-opacity: 0.9; }
        100% { r: 6px; stroke-opacity: 0.4; }
      }

      @keyframes dashStream {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }

      .p1 { animation: floatParticle 4s ease-in-out infinite; }
      .p2 { animation: floatParticle 6s ease-in-out infinite 1s; }
      .p3 { animation: floatParticle 5s ease-in-out infinite 2s; }
      .node { animation: pulseNode 3s ease-in-out infinite; }
      .stream-line { stroke-dasharray: 8, 8; animation: dashStream 4s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />
  
  <!-- Dynamic Network Grid Background -->
  <g opacity="0.25">
    <line x1="100" y1="50" x2="300" y2="120" stroke="#818cf8" stroke-width="1.5" />
    <line x1="300" y1="120" x2="200" y2="250" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="200" y1="250" x2="500" y2="220" stroke="#c084fc" stroke-width="1.5" />
    <line x1="1000" y1="60" x2="850" y2="150" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="850" y1="150" x2="1050" y2="240" stroke="#818cf8" stroke-width="1.5" stroke-class="stream-line" />
    <line x1="850" y1="150" x2="680" y2="80" stroke="#c084fc" stroke-width="1.5" />

    <circle cx="100" cy="50" r="6" fill="#38bdf8" class="node" />
    <circle cx="300" cy="120" r="7" fill="#818cf8" class="node" />
    <circle cx="200" cy="250" r="5" fill="#c084fc" class="node" />
    <circle cx="1000" cy="60" r="8" fill="#818cf8" class="node" />
    <circle cx="850" cy="150" r="6" fill="#38bdf8" class="node" />
    <circle cx="1050" cy="240" r="7" fill="#c084fc" class="node" />
  </g>

  <!-- Dynamic Ambient Glowing Orbs -->
  <circle cx="950" cy="80" r="70" fill="#818cf8" opacity="0.15" class="p1" filter="url(#glow)" />
  <circle cx="150" cy="220" r="90" fill="#c084fc" opacity="0.12" class="p2" filter="url(#glow)" />
  <circle cx="600" cy="50" r="60" fill="#38bdf8" opacity="0.1" class="p3" filter="url(#glow)" />

  <!-- Content Container (Foreground Title & Subtitle) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 50)">
      <rect width="210" height="32" rx="16" fill="#312e81" opacity="0.8" stroke="#6366f1" stroke-width="1" />
      <text x="15" y="21" class="badge-text">⚡ AI AGENT ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title" filter="url(#glow)">Awesome AI Agent Tool Registry</text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle">The Definitive Directory of SaaS Platforms, MCP Catalogs &amp; Open-Source Tool Registries</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="30" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
        <text x="12" y="20" font-family="sans-serif" font-size="13" fill="#38bdf8" font-weight="600">🛠️ MCP Servers</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(142, 0)">
        <rect width="145" height="30" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
        <text x="12" y="20" font-family="sans-serif" font-size="13" fill="#818cf8" font-weight="600">🔌 Tool Registries</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(299, 0)">
        <rect width="160" height="30" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
        <text x="12" y="20" font-family="sans-serif" font-size="13" fill="#c084fc" font-weight="600">🤖 Agent Action Hubs</text>
      </g>
    </g>
  </g>
</svg>
