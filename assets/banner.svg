<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatParticle{0%{transform:translateY(0) scale(1);opacity:.4}50%{transform:translateY(-15px) scale(1.15);opacity:.8}}@keyframes pulseNode{0%{r:6px;stroke-opacity:.4}50%{r:9px;stroke-opacity:.9}}@keyframes dashStream{0%{stroke-dashoffset:100}}.badge-text,.subtitle,.title{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:46px;fill:url(#textGrad)}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#e2e8f0}.p1{animation:floatParticle 4s ease-in-out infinite}.p2{animation:floatParticle 6s ease-in-out infinite 1s}.p3{animation:floatParticle 5s ease-in-out infinite 2s}.node{animation:pulseNode 3s ease-in-out infinite}</style></defs><rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/><g opacity=".25"><line x1="100" x2="300" y1="50" y2="120" stroke="#818cf8" stroke-width="1.5"/><line x1="300" x2="200" y1="120" y2="250" stroke="#38bdf8" stroke-width="1.5"/><line x1="200" x2="500" y1="250" y2="220" stroke="#c084fc" stroke-width="1.5"/><line x1="1000" x2="850" y1="60" y2="150" stroke="#38bdf8" stroke-width="1.5"/><line x1="850" x2="1050" y1="150" y2="240" stroke="#818cf8" stroke-class="stream-line" stroke-width="1.5"/><line x1="850" x2="680" y1="150" y2="80" stroke="#c084fc" stroke